<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi portafolio</title>
<style>
:root{--bg:#f7f5f0;--ink:#1d2327;--mute:#6b7378;--line:#d9d5cb;--acc:#1f5f5b;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#161a1c;--ink:#e8e6e0;--mute:#98a1a5;--line:#2c3336;--acc:#6fc3bb;--card:#1e2427}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.7 Georgia,"Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:56px 22px 120px}
header{border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:40px}
h1{font:700 clamp(2rem,6vw,3.2rem)/1.1 Georgia,serif;margin:0 0 10px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0}
h2{font:700 1.7rem/1.25 Georgia,serif;margin:0 0 8px}
p.t{margin:0;white-space:pre-wrap}
figure{margin:0}
img{max-width:100%;height:auto;display:block;border-radius:4px}
figcaption{color:var(--mute);font-size:.9rem;margin-top:8px}
.block{position:relative;margin:0 0 40px}
[contenteditable=true]{outline:1px dashed var(--line);outline-offset:6px;border-radius:2px;min-height:1.2em}
[contenteditable=true]:focus{outline:2px solid var(--acc)}
[contenteditable=true]:empty:before{content:attr(data-ph);color:var(--mute)}
.tools{display:none;gap:4px;margin-bottom:10px}
body.edit .tools{display:flex}
button{font:600 .8rem system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.add{display:none;gap:8px;flex-wrap:wrap;margin-top:20px}
body.edit .add{display:flex}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-top:1px solid var(--line);font:.85rem system-ui,sans-serif}
#st{color:var(--mute)}
#warn{background:#fff3cd;color:#5c4400;padding:12px 16px;font:.9rem system-ui,sans-serif;display:none}
.empty{color:var(--mute);font-style:italic}
.tools{flex-wrap:wrap;align-items:center}
.fmt{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tools label{font:.8rem system-ui,sans-serif;color:var(--mute);display:flex;gap:6px;align-items:center}
input[type=range]{width:90px;accent-color:var(--acc)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}
select{font:.8rem system-ui,sans-serif;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
hr{border:0;border-top:1px solid var(--line);margin:0}
.body{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <header>
    <h1 data-site="title" data-ph="Tu nombre"></h1>
    <p class="sub" data-site="sub" data-ph="Una línea sobre lo que haces"></p>
  </header>
  <div id="list"></div>
  <div class="add">
    <button data-add="title">+ Título</button>
    <button data-add="text">+ Texto</button>
    <button data-add="image">+ Imagen</button>
    <button data-add="divider">+ Separador</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</main>
<div class="bar">
  <span id="st">Conectando…</span>
  <button id="toggle">Editar</button>
</div>

<script>
const $ = s => document.querySelector(s);
const list = $("#list"), st = $("#st");
const status = t => st.textContent = t;
let editing = false, pending = 0, ver = -1, order = [];
const els = new Map(), timers = {};

async function api(body) {
  pending++; status("Guardando…");
  try {
    const r = await fetch("/api", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error(r.status);
    apply(await r.json());
    if (--pending === 0) status("Guardado ✓");
  } catch (e) { pending--; console.error(e); status("Error al guardar"); }
}
function debounce(k, body) {
  clearTimeout(timers[k]); status("Escribiendo…");
  timers[k] = setTimeout(() => api(body), 600);
}

document.querySelectorAll("[data-site]").forEach(el => el.addEventListener("input",
  () => debounce("s" + el.dataset.site, {op: "site", f: el.dataset.site, v: el.innerText.trim()})));

const busy = new Map();
const AL = `<button data-s="align" data-v="left">Izq</button><button data-s="align" data-v="center">Centro</button><button data-s="align" data-v="right">Der</button>`;
const FMT = {
  title: AL + `<label>Tamaño <input type="range" data-r="size" min="14" max="96"></label><button data-t="bold" title="Negrita"><b>N</b></button><button data-t="italic" title="Cursiva"><i>C</i></button><input type="color" data-r="color" title="Color"><select data-sel="font" title="Tipografía"><option value="serif">Serif</option><option value="sans">Sans</option><option value="mono">Mono</option></select>`,
  image: AL + `<label>Ancho <input type="range" data-r="width" min="10" max="100"></label>`,
  divider: ""
};
FMT.text = FMT.title;
const FONTS = {serif: 'Georgia,"Times New Roman",serif', sans: 'system-ui,-apple-system,"Segoe UI",sans-serif', mono: 'ui-monospace,Menlo,Consolas,monospace'};

function make(id) {
  const box = document.createElement("section");
  box.className = "block";
  box.innerHTML = `<div class="tools"><button data-a="up" title="Subir">↑</button><button data-a="down" title="Bajar">↓</button><button data-a="del">Eliminar</button><span class="fmt"></span></div><div class="body"></div>`;
  box.addEventListener("click", e => {
    const bt = e.target.closest("button"); if (!bt) return;
    const a = bt.dataset.a, it = order.find(o => o.id === id); if (!it) return;
    if (a === "del") { if (confirm("¿Eliminar este bloque?")) api({op: "del", id}); }
    else if (a) api({op: "move", id, dir: a === "up" ? -1 : 1});
    else if (bt.dataset.s) setStyle(id, bt.dataset.s, bt.dataset.v);
    else if (bt.dataset.t) {
      const s = it.st || {};
      const cur = bt.dataset.t === "bold" ? (s.bold ?? it.type === "title") : !!s.italic;
      setStyle(id, bt.dataset.t, !cur);
    }
  });
  box.addEventListener("input", e => {
    const k = e.target.dataset.r;
    if (k) setStyle(id, k, k === "color" ? e.target.value : +e.target.value);
  });
  box.addEventListener("change", e => { if (e.target.dataset.sel) setStyle(id, e.target.dataset.sel, e.target.value); });
  return box;
}

function paint(box, it) {
  const s = it.st || {}, t = it.type, body = box.querySelector(".body"), al = s.align || "left";
  const bold = s.bold ?? t === "title", size = s.size || (t === "title" ? 28 : 18);
  body.style.textAlign = al;
  if (t === "image") {
    const fg = body.querySelector("figure");
    fg.style.width = (s.width || 100) + "%";
    fg.style.marginLeft = al === "left" ? "0" : "auto";
    fg.style.marginRight = al === "right" ? "0" : "auto";
  } else if (t !== "divider") {
    const e = body.querySelector("[data-f]");
    e.style.fontSize = size + "px";
    e.style.fontWeight = bold ? 700 : 400;
    e.style.fontStyle = s.italic ? "italic" : "normal";
    e.style.color = s.color || "";
    e.style.fontFamily = FONTS[s.font] || "";
  }
  const f = box.querySelector(".fmt");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const val = {size, width: s.width || 100, color: s.color || (dark ? "#e8e6e0" : "#1d2327")};
  f.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", b.dataset.v === al));
  f.querySelector("[data-t=bold]")?.classList.toggle("on", !!bold);
  f.querySelector("[data-t=italic]")?.classList.toggle("on", !!s.italic);
  f.querySelectorAll("[data-r]").forEach(r => {
    if (r === document.activeElement) return;
    if (r.dataset.r === "size") r.max = t === "text" ? 48 : 96;
    r.value = val[r.dataset.r];
  });
  const sel = f.querySelector("select"); if (sel) sel.value = s.font || "serif";
}

function setStyle(id, f, v) {
  const it = order.find(o => o.id === id); if (!it) return;
  it.st = {...(it.st || {}), [f]: v};
  paint(els.get(id), it);
  if (!busy.has(id)) busy.set(id, new Set());
  busy.get(id).add(f);
  clearTimeout(timers[id + f]); status("Escribiendo…");
  const t = timers[id + f] = setTimeout(async () => {
    await api({op: "style", id, f, v});
    if (timers[id + f] === t) busy.get(id)?.delete(f);
  }, 400);
}

function fill(box, id, d) {
  const body = box.querySelector(".body");
  if (box.dataset.type !== d.type) {
    box.dataset.type = d.type;
    const ed = (tag, cls, f, ph) => `<${tag} class="${cls}" data-f="${f}" data-ph="${ph}"></${tag}>`;
    body.innerHTML = d.type === "title" ? ed("h2", "", "text", "Título")
      : d.type === "text" ? ed("p", "t", "text", "Escribe aquí…")
      : d.type === "divider" ? "<hr>"
      : `<figure><img alt=""><figcaption data-f="caption" data-ph="Pie de foto"></figcaption></figure>`;
    box.querySelector(".fmt").innerHTML = FMT[d.type];
    body.querySelectorAll("[data-f]").forEach(el => el.addEventListener("input",
      () => debounce(id + el.dataset.f, {op: "upd", id, f: el.dataset.f, v: el.innerText})));
  }
  body.querySelectorAll("[data-f]").forEach(el => {
    if (document.activeElement !== el) el.textContent = d[el.dataset.f] || "";
  });
  const img = body.querySelector("img");
  if (img && !img.getAttribute("src")) img.src = "/api?img=" + id;
  if (!busy.get(id)?.size) paint(box, d);
  setEditable();
}
function setEditable() {
  document.querySelectorAll("[data-f],[data-site]").forEach(el => el.contentEditable = editing);
  document.body.classList.toggle("edit", editing);
  $("#toggle").textContent = editing ? "Terminar edición" : "Editar";
}

function apply(s) {
  if (s.v === ver) return;
  ver = s.v;
  document.querySelectorAll("[data-site]").forEach(el => {
    if (document.activeElement !== el) el.textContent = s.site[el.dataset.site] || "";
  });
  const items = [...s.blocks].sort((a, b) => a.order - b.order);
  order = items;
  const ids = new Set(items.map(i => i.id));
  els.forEach((el, id) => { if (!ids.has(id)) { el.remove(); els.delete(id); } });
  items.forEach(it => {
    let box = els.get(it.id);
    if (!box) { box = make(it.id); els.set(it.id, box); }
    fill(box, it.id, it);
    list.appendChild(box);
  });
  const emp = list.querySelector(".empty");
  if (!items.length && !emp) list.insertAdjacentHTML("beforeend", '<p class="empty">Aún no hay contenido. Pulsa «Editar» para añadir el primer bloque.</p>');
  else if (items.length && emp) emp.remove();
}

async function poll() {
  if (pending) return;
  try {
    const r = await fetch("/api", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    apply(await r.json());
    if (!pending) status("En línea · sincronizado");
  } catch (e) { status("Sin conexión con el servidor"); }
}
poll(); setInterval(poll, 3000);

document.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
  const type = b.dataset.add;
  if (type === "image") return $("#file").click();
  api({op: "add", type});
}));

$("#file").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 1000, r = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let q = .8, src = c.toDataURL("image/jpeg", q);
    while (src.length > 1000000 && q > .3) src = c.toDataURL("image/jpeg", q -= .1);
    if (src.length > 1000000) return alert("La imagen es demasiado grande. Prueba con una más pequeña.");
    api({op: "add", type: "image", b64: src.split(",")[1]});
  };
  img.src = URL.createObjectURL(f);
});

$("#toggle").addEventListener("click", () => { editing = !editing; setEditable(); });
setEditable();
</script>
</body>
</html>
